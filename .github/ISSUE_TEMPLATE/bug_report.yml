name: Bug Report
description: Report a bug to help us improve
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us investigate.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Please describe the bug you encountered.
      placeholder: Describe the issue in detail
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: Please provide clear steps to reproduce the issue.
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true
  - type: input
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
      placeholder: The app should...
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Low
        - Medium
        - High
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, browser (if relevant), Streamlit version
      placeholder: "Python 3.9, Windows 11, Chrome"
  - type: textarea
    id: logs_screenshots
    attributes:
      label: Screenshots or logs
      description: If applicable, add screenshots, error messages, or log output
      placeholder: Paste error output or attach screenshots
