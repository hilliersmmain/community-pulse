name: CI - Testing & Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov flake8 black

      - name: Code formatting check with Black
        run: |
          black --check --line-length=120 utils/ community_pulse/ tests/

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 utils/ community_pulse/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # General linting should block CI on violations while honoring project line-length/formatting policy.
          flake8 utils/ community_pulse/ --count --max-complexity=10 --max-line-length=120 --ignore=E203,W503,E501 --statistics

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy utils/ community_pulse/ --ignore-missing-imports

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Generate coverage report
        run: |
          pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=70

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Security scan with Bandit
        run: |
          pip install bandit
          # Scan Python files for common security issues
          # Fail on confirmed high-severity findings (HIGH severity + HIGH confidence)
          bandit -r utils/ community_pulse/ -lll -iii -f json -o bandit-report.json

      - name: Display test summary
        if: always()
        run: |
          echo "✅ Test execution completed. Check logs above for details."
